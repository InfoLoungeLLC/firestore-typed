name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2  # for code coverage reports

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        if: always()
        run: npm run format:check

      - name: Type check
        if: always()
        run: npm run typecheck

      - name: Run tests with coverage
        if: always()
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  emulator-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Setup Java (required by the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run emulator tests
        run: npx --yes firebase-tools@15 emulators:exec --project demo-firestore-typed --only firestore 'npm run test:emulator'
